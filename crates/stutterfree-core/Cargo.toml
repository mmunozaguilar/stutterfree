[package]
name = "stutterfree-core"
description = "StutterFree core: game discovery, Proton warmer driver, recorder management and shader cache handling"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
serde_repr = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
brotli = "7"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
lz4_flex = "0.11"
lzma-rs = "0.3"
oozextract = "0.5"
flate2 = "1"
num-bigint = "0.4"
aes = "0.8"

[dev-dependencies]
tempfile = "3"
