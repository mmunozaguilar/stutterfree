[workspace]
resolver = "2"
members = ["crates/stutterfree-core", "crates/stutterfree-cli", "crates/stutterfree-gui"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["The SCSKiller authors", "The Shaderless contributors", "The StutterFree contributors"]

[workspace.dependencies]
stutterfree-core = { path = "crates/stutterfree-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
